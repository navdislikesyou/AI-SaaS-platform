<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; color: #333; line-height: 1.6;">

    <p>Dear {{ recipient_name }},</p>

    <p>You are invited to attend the following meeting:</p>

    <table style="border-collapse: collapse; width: 100%;">
        <tr>
            <td style="padding: 8px;"><b>Meeting</b></td>
            <td style="padding: 8px;">{{ title }}</td>
        </tr>
        <tr>
            <td style="padding: 8px;"><b>Purpose</b></td>
            <td style="padding: 8px;">{{ reason }}</td>
        </tr>
        <tr>
            <td style="padding: 8px;"><b>Date</b></td>
            <td style="padding: 8px;">{{ date }}</td>
        </tr>
        <tr>
            <td style="padding: 8px;"><b>Time</b></td>
            <td style="padding: 8px;">{{ time }}</td>
        </tr>
        <tr>
            <td style="padding: 8px;"><b>Venue</b></td>
            <td style="padding: 8px;">{{ venue }}</td>
        </tr>
    </table>

    <p>Your participation is requested. Please make the necessary arrangements to attend.</p>

    <p>Regards,<br>{{ sender_name }}</p>

</body>
</html>
