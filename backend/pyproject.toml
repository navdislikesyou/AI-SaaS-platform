[project]
name = "ai-saas-backend"
version = "0.1.0"
description = "Backend foundation for the AI SaaS Platform"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Depends(...) in argument defaults is the documented FastAPI pattern.
"app/api/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

# The agent packages are developed separately and are not type annotated.
# `mypy app` follows the adapters' imports into them, so skip analysis of
# those modules rather than reporting their errors as app failures. Adapters
# and services are still checked; only the agent internals are skipped.
[[tool.mypy.overrides]]
module = [
    "knowledge_agent.*",
    "automation_agent.*",
    "performance_agent.*",
]
follow_imports = "skip"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"